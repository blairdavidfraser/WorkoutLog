<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d32f2f">
  <meta name="description" content="Track your daily workouts, cardio, strength training, and health metrics">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout Log">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
  <link rel="manifest" href="manifest.json">
  <title>Fitness Coach - Workout Tracker</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
  <div id="app" class="app-container">
    <!-- Navigation -->
    <nav class="app-nav">
      <div class="hamburger-wrapper" id="hamburger-wrapper">
        <button id="hamburger-btn" class="hamburger-btn">☰</button>
        <div id="hamburger-dropdown" class="hamburger-dropdown">
          <button id="hamburger-mode-btn">Edit Log</button>
          <button id="hamburger-github-btn">⬆️ GitHub</button>
        </div>
      </div>
      <div class="nav-tabs">
        <button class="nav-tab active" data-view="dashboard">Dashboard</button>
        <button class="nav-tab" data-view="planning">Planning</button>
        <button class="nav-tab" data-view="history">History</button>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="app-main">
      <!-- Dashboard View -->
      <section id="dashboard" class="view active">
        <div class="dashboard-container">
          <div class="time-period-selector">
            <button class="period-btn" data-period="10">10 Days</button>
            <button class="period-btn" data-period="30">30 Days</button>
            <button class="period-btn" data-period="365">1 Year</button>
          </div>
          <div class="graphs-container">
            <div class="graph-card" id="weight-card">
              <h3 class="graph-card-title">Weight Trend</h3>
              <div class="graph-card-body" id="weight-body">
                <canvas id="weight-chart"></canvas>
              </div>
            </div>
            <div class="graph-card" id="waist-card">
              <h3 class="graph-card-title">Waist Trend</h3>
              <div class="graph-card-body" id="waist-body">
                <canvas id="waist-chart"></canvas>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Planning View -->
      <section id="planning" class="view">
        <div class="viewer-container">
          <div class="viewer-header">
            <div class="viewer-actions" style="flex:1">
              <button id="plan-copy-btn" class="add-entry-btn" style="width:100%">Copy to Clipboard</button>
            </div>
          </div>
          <div id="plan-content" class="viewer-content">
          </div>
        </div>
      </section>

      <!-- History (View + Edit combined) -->
      <section id="history" class="view">
        <div class="viewer-container">
          <div class="viewer-header">
            <div class="search-bar" id="viewer-search-bar">
              <input type="text" id="editor-search" class="search-input" placeholder="Search or select a tag...">
              <datalist id="tag-suggestions">
              </datalist>
            </div>
            <div class="editor-header-actions" id="editor-header-actions" style="display: none;">
              <button id="select-all-btn" class="editor-header-btn">Select All</button>
              <button id="save-btn" class="editor-header-btn editor-header-btn--primary">Save</button>
              <button id="cancel-btn" class="editor-header-btn">Cancel</button>
            </div>
            <div class="viewer-actions">
              <button id="back-btn" class="back-btn" style="display: none;">← Back</button>
              <div class="add-entry-wrapper" id="add-entry-wrapper">
                <button id="add-entry-btn" class="add-entry-btn">Add</button>
                <div id="add-entry-dropdown" class="add-entry-dropdown">
                  <button data-entry-type="daily">Daily Log</button>
                  <button data-entry-type="cardio">Cardio Entry</button>
                  <button data-entry-type="strength">Strength Entry</button>
                  <button data-entry-type="nutrition">Nutrition Entry</button>
                  <button data-entry-type="misc">Miscellaneous Entry</button>
                </div>
              </div>
            </div>
          </div>
          <div id="viewer-content" class="viewer-content">
            <!-- Log entries rendered here -->
          </div>
          <div id="editor-panel" class="editor-panel" style="display: none;">
            <textarea id="log-textarea" class="log-textarea" placeholder="Workout log will appear here..."></textarea>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="assets/scripts/app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    // Register Service Worker for offline support and updates
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('Service Worker registered successfully:', registration);

            // Check for updates periodically
            setInterval(() => {
              registration.update();
            }, 60000); // Check every 60 seconds

            // Listen for controller change (new SW activated)
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              // Notify user of update
              console.log('App updated! Please refresh to see changes.');
              // Optional: Show a toast or notification to user
              if (window.confirm('App updated! Refresh now to see changes?')) {
                window.location.reload();
              }
            });

            // Handle messages from service worker
            registration.active?.postMessage({ type: 'CHECK_FOR_UPDATES' });
          })
          .catch((error) => {
            console.error('Service Worker registration failed:', error);
          });
      });
    } else {
      console.warn('Service Workers not supported in this browser');
    }
  </script>
</body>

</html>
